name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: contract
          POSTGRES_PASSWORD: contract
          POSTGRES_DB: contract_review_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U contract -d contract_review_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Tests only use TEST_DATABASE_URL; DATABASE_URL must differ (safety check in conftest).
      DATABASE_URL: postgresql+psycopg://contract:contract@localhost:5432/contract_review
      TEST_DATABASE_URL: postgresql+psycopg://contract:contract@localhost:5432/contract_review_test
      # No LLM API keys are configured in CI: live tests are deselected and nothing calls out.
      LLM_PROVIDER: gemini

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          working-directory: backend
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest
