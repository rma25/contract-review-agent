services:
  postgres:
    image: postgres:16-alpine
    container_name: contract-review-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: contract
      POSTGRES_PASSWORD: contract
      POSTGRES_DB: contract_review
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs only on first start (empty volume): creates the test database.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contract -d contract_review"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
